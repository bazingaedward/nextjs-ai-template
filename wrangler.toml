#:schema node_modules/wrangler/config-schema.json
# wrangler.toml
name = "nextjs-ai-template"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2024-12-30"
compatibility_flags = [
  # Enable Node.js API
  # see https://developers.cloudflare.com/workers/configuration/compatibility-flags/#nodejs-compatibility-flag
  "nodejs_compat"
]

# Create a R2 binding with the binding name "NEXT_INC_CACHE_R2_BUCKET"
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "<BUCKET_NAME>"

[vars]
GOOGLE_CLIENT_ID = "734784472277-ike4ja77h9t3khpr1hu1qu8h1b5ssmqg.apps.googleusercontent.com"
GITHUB_CLIENT_ID = "Iv23liH2R1uPkNlfkObU"

# D1 Database for authentication
# Create with: wrangler d1 create nextjs-auth-db
# Then update the database_id below
[[d1_databases]]
binding = "DB"
database_name = "nextjs-auth-db"
database_id = "f39a421f-a51a-46e1-809c-7354b3f6fd61"
